spring:
  datasource:
    url: jdbc:h2:mem:ai_code_review;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.aipr.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

github:
  token:
  api-base-url: https://api.github.com

ai:
  base-url: https://api.deepseek.com
  api-key: test-key
  model-name: deepseek-chat
  temperature: 0.2
  max-tokens: 3000

rate-limit:
  enabled: false

review:
  ai:
    file-review-concurrency: 3
    file-review-timeout-seconds: 60
  diff:
    max-files: 30
    max-file-patch-chars: 12000
    max-total-patch-chars: 100000
