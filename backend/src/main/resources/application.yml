server:
  port: 8080

spring:
  application:
    name: ai-pr-review-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ai_review_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 600000
      idle-timeout: 300000
      keepalive-time: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:49.232.59.230}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.example.aipr.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
github:
  token: ${GITHUB_TOKEN:}
  api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  connect-timeout-seconds: ${GITHUB_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${GITHUB_READ_TIMEOUT_SECONDS:30}

ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${AI_API_KEY:}
  model-name: ${AI_MODEL_NAME:deepseek-chat}
  temperature: ${AI_TEMPERATURE:0.2}
  max-tokens: 3000

logging:
  level:
    root: INFO
    com.example.aipr: INFO
    com.example.aipr.mapper: WARN
    org.mybatis: WARN
    com.baomidou.mybatisplus: WARN
    com.zaxxer.hikari: WARN

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  create-review:
    ip-limit: ${RATE_LIMIT_CREATE_REVIEW_IP_LIMIT:5}
    ip-window-seconds: ${RATE_LIMIT_CREATE_REVIEW_IP_WINDOW_SECONDS:60}
    pr-limit: ${RATE_LIMIT_CREATE_REVIEW_PR_LIMIT:1}
    pr-window-seconds: ${RATE_LIMIT_CREATE_REVIEW_PR_WINDOW_SECONDS:30}
  force-refresh:
    limit: ${RATE_LIMIT_FORCE_REFRESH_LIMIT:1}
    window-seconds: ${RATE_LIMIT_FORCE_REFRESH_WINDOW_SECONDS:300}

