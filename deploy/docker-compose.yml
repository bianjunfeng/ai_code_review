services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ai-pr-review-mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ai_code_review
      MYSQL_USER: ${DB_USERNAME:-ai_review_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ai_review_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-pr-review-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 主应用
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ai-pr-review:${VERSION:-latest}
    container_name: ai-pr-review
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_URL=jdbc:mysql://mysql:3306/ai_code_review?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME:-ai_review_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_review_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-deepseek-chat}
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
